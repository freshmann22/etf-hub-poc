<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ETF 탐색 HTML Prototype</title>
  <style>
    :root{--mint:#007CA9;--mint2:#0f8cb7;--green:#176b59;--red:#e9497b;--blue:#3574d4;--bg:#f5f7fb;--card:#fff;--text:#141824;--muted:#7b8495;--line:#e8ecf3;--shadow:0 10px 24px rgba(20,30,50,.08);--r:18px}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;color:var(--text)}
    .wrap{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:0}.phone{width:390px;height:844px;background:var(--bg);overflow:hidden;position:relative}.screen{height:100%;overflow:auto;background:var(--bg);padding:20px 16px 92px}.screen::-webkit-scrollbar{display:none}.hidden{display:none!important}.topbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 16px}.title{font-weight:850;font-size:24px;letter-spacing:-.5px}.iconbtn{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:#465063}.search{height:48px;border-radius:18px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;color:#828b9d;box-shadow:0 6px 16px rgba(30,40,60,.04);font-weight:650}.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-radius:18px;padding:4px;margin:16px 0 12px;box-shadow:0 6px 18px rgba(30,40,60,.05)}.tab{border:0;background:transparent;border-radius:14px;padding:12px 0;font-weight:800;color:#667085}.tab.active{background:linear-gradient(135deg,#e7fbff,#fff);color:var(--green);box-shadow:inset 0 -2px 0 var(--green)}.filterPanel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;box-shadow:var(--shadow);margin-bottom:14px}.filterTitle{font-size:14px;font-weight:850;margin:0 0 10px;color:#303747}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #dfe5ee;background:#fff;border-radius:12px;padding:9px 11px;font-weight:780;font-size:14px;color:#344054;box-shadow:0 3px 8px rgba(30,40,60,.03)}.chip.active{background:linear-gradient(135deg,#253ee8,#5b22e6);color:#fff;border-color:transparent}.listHead{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}.listHead b{font-size:16px}.select{border:0;background:transparent;color:#596579;font-weight:750}.etfRow{display:grid;grid-template-columns:26px 42px 1fr 76px 30px;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 10px;margin-bottom:9px;box-shadow:0 5px 16px rgba(30,40,60,.04);cursor:pointer}.rank{font-weight:900;color:#c18a19;text-align:center}.ci{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:900;background:linear-gradient(135deg,#1b39d0,#009ed0)}.name{font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:#6d7585;margin-top:2px}.spark svg{width:72px;height:26px;display:block}.perf{font-size:12px;color:var(--red);font-weight:850;text-align:right}.price{font-size:11px;color:#525c6d;text-align:right;margin-top:1px}.star{color:#b6bdca;font-size:22px}.bottomNav{position:absolute;bottom:0;left:0;right:0;height:76px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding-bottom:8px}.navItem{text-align:center;font-size:11px;font-weight:800;color:#7b8495}.navItem.active{color:var(--mint)}.navIcon{font-size:20px;display:block;margin-bottom:3px}.back{display:flex;align-items:center;gap:8px;font-weight:850}.priceBig{font-size:32px;font-weight:900;color:var(--red);letter-spacing:-.7px}.sub{font-size:12px;color:var(--muted);font-weight:650}.change{font-weight:850;color:var(--red);margin:5px 0 6px}.periods{display:flex;gap:16px;margin:10px 0 8px}.period{font-size:12px;font-weight:850;color:#6d7585}.period.active{background:#142036;color:#fff;border-radius:13px;padding:6px 10px;margin-top:-6px}.chartCard{background:#fff;border-radius:18px;padding:8px 0 0;margin:8px 0 0}.chart svg{width:100%;height:176px}.detailTabs{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}.detailTab{border:0;background:#fff;padding:13px 0;font-weight:850;color:#667085}.detailTab.active{color:#176b59;border-bottom:3px solid #176b59}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:0 6px 18px rgba(30,40,60,.04)}.cardTitle{font-weight:900;font-size:18px;margin-bottom:14px}.kv{display:grid;grid-template-columns:1fr auto;gap:12px;font-size:14px;margin:12px 0;color:#606a7a}.kv b{color:#303747}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border-right:1px solid var(--line);padding-right:8px}.metric:last-child{border-right:0}.metric small{display:block;color:#7b8495;font-weight:700}.metric b{font-size:19px}.cta{position:absolute;left:16px;right:16px;bottom:84px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:1px solid #d8dee9;background:#fff;border-radius:14px;height:50px;font-weight:900;color:#364052}.btn.buy{background:#287663;color:#fff;border-color:#287663}.holding{margin:11px 0}.holdingTop{display:grid;grid-template-columns:1fr auto;align-items:end;font-weight:850}.holdingMeta{font-size:12px;color:#3574d4;margin-top:4px}.bar{height:12px;background:#f0f2f6;border-radius:20px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#e54f8a,#a9447b);border-radius:20px}.divSummary{border:1px solid var(--line);border-radius:18px;padding:12px 16px}.divChart{height:154px;display:flex;align-items:end;gap:8px;padding:16px 2px 8px}.divBar{flex:1;background:#e85b8d;border-radius:7px 7px 0 0;min-height:32px}.history{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid var(--line);padding:12px 0;font-size:14px}.returnPanel{background:#171a24;color:#ced5e6;border-radius:16px;overflow:hidden;margin-top:12px}.returnTop{padding:12px 10px 0;font-size:14px;font-weight:800}.returnTop span{color:#ff4a6a}.returnPanel svg{width:100%;height:188px;display:block}.range{display:grid;grid-template-columns:repeat(6,1fr);background:#0b0e15}.range button{border:0;background:transparent;color:#acb4c7;padding:12px 0;font-weight:850}.range button.active{border:1px solid #fff;border-radius:5px;margin:5px;color:#fff}.note{font-size:12px;color:#8a93a5;margin-top:8px;line-height:1.45}
  </style>
</head>
<body>
<div class="wrap">
  <main class="phone">
    <section id="home" class="screen">
      <div class="topbar"><div class="title">ETF 탐색</div><button class="iconbtn">⌘</button></div>
      <div class="search">⌕ ETF 검색 <span style="font-size:12px">종목명, 테마, 지수 등</span><span style="margin-left:auto">🎙</span></div>
      <div class="tabs" id="categoryTabs"></div>
      <div class="filterPanel"><p class="filterTitle" id="filterTitle">섹터 부문</p><div class="chips" id="chips"></div></div>
      <div class="listHead"><b id="listTitle">AI/반도체 관련 ETF <span class="sub">(총 24개)</span></b><button class="select">수익률순⌄</button></div>
      <div id="etfList"></div>
    </section>
    <section id="detail" class="screen hidden">
      <div class="topbar"><div class="back" onclick="showHome()">‹ ETF 탐색</div><button class="iconbtn">☆</button></div>
      <div class="title" id="detailName">KODEX AI반도체</div><div class="sub" id="detailMeta">산업섹터 · 국내 · 테마형</div>
      <div class="priceBig" id="detailPrice">12,450원</div><div class="change" id="detailChange">◆ 260원 (+2.15%)</div><div class="sub" style="text-align:right">07.14 10:35 기준</div>
      <div class="periods"><span class="period active">1D</span><span class="period">1W</span><span class="period">1M</span><span class="period">3M</span><span class="period">1Y</span><span class="period">3Y</span></div>
      <div class="chartCard chart"><svg viewBox="0 0 360 176"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ef5b8e" stop-opacity=".35"/><stop offset="1" stop-color="#ef5b8e" stop-opacity="0"/></linearGradient></defs><path d="M10 125 L40 78 L60 40 L82 100 L110 92 L135 65 L160 98 L190 82 L220 70 L250 58 L280 72 L315 45 L350 50" fill="none" stroke="#e9497b" stroke-width="3"/><path d="M10 125 L40 78 L60 40 L82 100 L110 92 L135 65 L160 98 L190 82 L220 70 L250 58 L280 72 L315 45 L350 50 L350 160 L10 160 Z" fill="url(#fill)"/><g stroke="#edf0f5"><line x1="10" y1="50" x2="350" y2="50"/><line x1="10" y1="100" x2="350" y2="100"/><line x1="10" y1="150" x2="350" y2="150"/></g></svg></div>
      <div class="detailTabs" id="detailTabs"></div><div id="detailBody"></div>
    </section>
    <nav class="bottomNav"><div class="navItem active"><span class="navIcon">⌂</span>홈</div><div class="navItem"><span class="navIcon">◎</span>관심</div><div class="navItem"><span class="navIcon">⇄</span>비교</div><div class="navItem"><span class="navIcon">☰</span>메뉴</div></nav>
    <div id="cta" class="cta hidden"><button class="btn">관심추가</button><button class="btn buy">매수</button></div>
  </main>

</div>
<script>
const groups={
  sector:['게임/엔터/미디어','IT','의료/제약/바이오','반도체','전기차/2차전지','클린에너지','원자재','자율주행/모빌리티','테크/기술','금융','우주항공/방산','AI전력/인프라'],
  strategy:['레버리지','인버스','성장주','가치주','부동산 리츠','경기소비재','S&P500','나스닥100','밸류업'],
  dividend:['한국 고배당','미국 배당성장','커버드콜 배당','월배당']
};
const labels={sector:'섹터 부문',strategy:'전략 부문',dividend:'배당 부문'};
const dummyEtfs=[
 {name:'KODEX AI반도체',ci:'KODEX',meta:'국내 · 반도체',price:'12,450원',day:'+2.15%',r1m:'+8.1%',r3m:'+14.2%',r6m:'+22.8%',r1y:'+41.3%',listed:'2023.05.17'},
 {name:'TIGER 미국반도체TOP10',ci:'TIGER',meta:'해외 · 미국',price:'16,890원',day:'+1.75%',r1m:'+6.2%',r3m:'+12.1%',r6m:'+19.6%',r1y:'+36.0%',listed:'2021.04.09'},
 {name:'SOL AI글로벌',ci:'SOL',meta:'해외 · 미국',price:'14,120원',day:'+1.32%',r1m:'+5.7%',r3m:'+9.8%',r6m:'+17.4%',r1y:'+28.9%',listed:'2024.03.12'},
 {name:'ACE 미국AI반도체핵심체인',ci:'ACE',meta:'해외 · 글로벌',price:'13,230원',day:'+1.08%',r1m:'+4.9%',r3m:'+8.4%',r6m:'+15.7%',r1y:'+24.1%',listed:'2022.11.15'},
 {name:'KODEX 글로벌반도체',ci:'KODEX',meta:'국내 · 미국',price:'11,540원',day:'+0.94%',r1m:'+3.8%',r3m:'+7.2%',r6m:'+13.0%',r1y:'+21.5%',listed:'2020.08.07'},
 {name:'TIGER 퀄리티테마반도체',ci:'TIGER',meta:'해외 · 미국',price:'17,120원',day:'+0.83%',r1m:'+3.1%',r3m:'+6.4%',r6m:'+11.8%',r1y:'+19.6%',listed:'2025.01.21'},
 {name:'KODEX 미국반도체MV',ci:'KODEX',meta:'해외 · 미국',price:'12,980원',day:'+0.77%',r1m:'+2.9%',r3m:'+5.9%',r6m:'+10.5%',r1y:'+17.2%',listed:'2019.06.28'}
];
let currentGroup='sector', selectedChip=groups.sector[3], selectedEtf=dummyEtfs[0], detailTab='summary';
function renderCategory(){const el=document.getElementById('categoryTabs');el.innerHTML=Object.keys(groups).map(k=>`<button class="tab ${k===currentGroup?'active':''}" onclick="setGroup('${k}')">${labels[k].replace(' 부문','')}</button>`).join('');}
function setGroup(k){currentGroup=k;selectedChip=groups[k][0];renderAll();}
function setChip(c){selectedChip=c;renderAll();}
function renderChips(){document.getElementById('filterTitle').textContent=labels[currentGroup];document.getElementById('chips').innerHTML=groups[currentGroup].map(c=>`<button class="chip ${c===selectedChip?'active':''}" onclick="setChip('${c}')">${c}</button>`).join('');document.getElementById('listTitle').innerHTML=`${selectedChip} 관련 ETF <span class="sub">(총 ${currentGroup==='sector'?24:12}개)</span>`;}
function spark(i){return `<svg viewBox="0 0 72 26"><polyline points="0,22 8,18 16,19 24,12 32,14 40,8 48,10 56,5 64,8 72,3" fill="none" stroke="#e9497b" stroke-width="2"/><path d="M0 22 L8 18 L16 19 L24 12 L32 14 L40 8 L48 10 L56 5 L64 8 L72 3 L72 26 L0 26Z" fill="#e9497b22"/></svg>`}
function renderList(){document.getElementById('etfList').innerHTML=dummyEtfs.map((e,i)=>`<div class="etfRow" onclick="openDetail(${i})"><div class="rank">${i+1}</div><div class="ci">${e.ci}</div><div><div class="name">${e.name}</div><div class="meta">${e.meta} · 1M ${e.r1m} · 3M ${e.r3m} · 6M ${e.r6m} · 1Y ${e.r1y}</div></div><div><div class="spark">${spark(i)}</div><div class="perf">${e.day}</div><div class="price">${e.price}</div></div><div class="star">☆</div></div>`).join('');}
function renderAll(){renderCategory();renderChips();renderList();}
function openDetail(i){selectedEtf=dummyEtfs[i];document.getElementById('home').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');document.getElementById('cta').classList.remove('hidden');document.getElementById('detailName').textContent=selectedEtf.name;document.getElementById('detailMeta').textContent=selectedEtf.meta+' · 테마형';document.getElementById('detailPrice').textContent=selectedEtf.price;document.getElementById('detailChange').textContent=`◆ ${selectedEtf.day.replace('+','')} 상승 (${selectedEtf.day})`;renderDetailTabs();renderDetailBody();}
function showHome(){document.getElementById('detail').classList.add('hidden');document.getElementById('home').classList.remove('hidden');document.getElementById('cta').classList.add('hidden');}
function setDetailTab(t){detailTab=t;renderDetailTabs();renderDetailBody();}
function renderDetailTabs(){const tabs=[['summary','요약'],['holdings','구성종목'],['returns','수익률'],['dividend','배당']];document.getElementById('detailTabs').innerHTML=tabs.map(([k,v])=>`<button class="detailTab ${detailTab===k?'active':''}" onclick="setDetailTab('${k}')">${v}</button>`).join('');}
function renderDetailBody(){const b=document.getElementById('detailBody');if(detailTab==='summary') b.innerHTML=`<div class="card"><div class="cardTitle">기본정보 ›</div>${[['순자산총액','3,245억원'],['설정일','2023.05.16'],['총 보수','0.39%'],['추적지수','FnGuide AI반도체 지수'],['운용사','삼성자산운용'],['상장일',selectedEtf.listed]].map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card"><div class="cardTitle">주요 지표</div><div class="metrics"><div class="metric"><small>PER</small><b>24.8</b></div><div class="metric"><small>PBR</small><b>4.32</b></div><div class="metric"><small>배당수익률</small><b>0.48%</b></div></div></div>`;
 if(detailTab==='holdings') b.innerHTML=`<div class="card"><div class="cardTitle">구성종목</div>${[['SK하이닉스','-1,795,000원 (-2.71%)','24.05%'],['KODEX 200','-107,660원 (-1.07%)','15.21%'],['SK스퀘어','1,167,000원 (+1.04%)','9.44%'],['삼성전자','-1,214,000원 (-0.74%)','8.62%'],['기타','196개 종목','42.68%']].map(x=>`<div class="holding"><div class="holdingTop"><span>${x[0]}</span><span>${x[2]}</span></div><div class="holdingMeta">${x[1]}</div><div class="bar"><span style="width:${parseFloat(x[2])*2.2}%"></span></div></div>`).join('')}</div>`;
 if(detailTab==='dividend') b.innerHTML=`<div class="card"><div class="cardTitle">배당요약</div><div class="divSummary">${[['지급 주기 (금년)','7번 / 1,2,3,4,5,6,7월'],['지급 주기 (작년)','12번 / 매월'],['주당 배당금 (최근 1년)','2,880원'],['배당수익률 (연)','13.80%']].map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div><div class="card"><div class="cardTitle">배당 지급 내역</div><div class="divChart">${[50,52,53,52,58,66,63,72,85,89,92,128,130,118].map(h=>`<div class="divBar" style="height:${h}px"></div>`).join('')}</div>${[['12월 12일','196원'],['11월 13일','196원'],['10월 14일','172원'],['09월 12일','161원']].map(x=>`<div class="history"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`;
 if(detailTab==='returns') b.innerHTML=`<div class="returnPanel"><div class="returnTop">${baselineText()}보다 <span>+303.55%</span></div><svg viewBox="0 0 360 188"><g stroke="#2a2e3b" stroke-dasharray="2 4"><line x1="0" y1="40" x2="360" y2="40"/><line x1="0" y1="80" x2="360" y2="80"/><line x1="0" y1="120" x2="360" y2="120"/></g><polyline points="0,130 35,132 70,128 105,134 140,136 175,130 210,126 245,120 280,128 310,112 326,92 338,78 348,38 356,70" fill="none" stroke="#8284ff" stroke-width="2.5"/><text x="10" y="170" fill="#7e879a" font-size="10">21.09 22.03 22.09 23.03 23.09 24.03 24.09 25.03 25.09 26.03 26.07</text></svg><div class="range"><button>1주 전</button><button>1달 전</button><button>3달 전</button><button>1년 전</button><button class="active">5년 전</button><button>최대</button></div></div><div class="note">수익률 기준점은 5년 전입니다. 단, 상장 후 5년이 지나지 않은 ETF는 상장일(${selectedEtf.listed})을 기준점으로 사용합니다.</div>`;}
function baselineText(){return new Date(selectedEtf.listed.replaceAll('.','-'))>new Date('2021-07-14')?selectedEtf.listed+' 상장일':'2021년 7월 14일'}
renderAll();
</script>
</body>
</html>
